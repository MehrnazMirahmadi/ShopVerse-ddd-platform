services:
  inventorydb:
    container_name: inventorydb
    image: mcr.microsoft.com/mssql/server
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=SwN12345678
    restart: always
    ports:
      - "1434:1433"
    volumes:
      - inventorydbdata:/var/opt/mssql

  orderdb:
    container_name: orderdb
    image: mcr.microsoft.com/mssql/server
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=SwN12345678
    restart: always
    ports:
      - "1433:1433"
    volumes:
      - orderdbdata:/var/opt/mssql

  # messagebroker:
  #   image: rabbitmq:3-management
  #   container_name: rabbitmq
  #   ports:
  #     - "5672:5672"
  #     - "15672:15672"
  #   environment:
  #     RABBITMQ_DEFAULT_USER: guest
  #     RABBITMQ_DEFAULT_PASS: guest
  #   restart: always

  inventoryservice:
    build: .
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Database=Server=inventorydb;Database=InventoryDb;User Id=sa;Password=SwN12345678;TrustServerCertificate=True
      # - RabbitMQ__Host=messagebroker
      # - RabbitMQ__Username=guest
      # - RabbitMQ__Password=guest
    depends_on:
      - inventorydb
      # - messagebroker
    ports:
      - "6001:8080"
      - "6061:8081"

  salesservice:
    build: .
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Database=Server=orderdb;Database=OrderDb;User Id=sa;Password=SwN12345678;TrustServerCertificate=True
      # - RabbitMQ__Host=messagebroker
      # - RabbitMQ__Username=guest
      # - RabbitMQ__Password=guest
    depends_on:
      - orderdb
      # - messagebroker
      - inventoryservice
    ports:
      - "6000:8080"
      - "6060:8081"

volumes:
  inventorydbdata:
  orderdbdata:
