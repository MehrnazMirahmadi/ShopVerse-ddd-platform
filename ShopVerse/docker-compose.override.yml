services:
  inventorydb :
    container_name: inventorydb
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=SwN12345678
    healthcheck:
      test: ["CMD-SHELL", "netstat -tuln | grep 1433 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    ports:
      - "1434:1433"  
    volumes:
      - inventorydbdata:/var/opt/mssql
  orderdb :
    container_name: orderdb
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=SwN12345678
    healthcheck:
      test: ["CMD-SHELL", "netstat -tuln | grep 1433 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    restart: always
    ports:
      - "1433:1433"
    volumes:
      - orderdbdata:/var/opt/mssql
  inventoryservice:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__Database=Server=inventorydb;Database=InventoryDb;User Id=sa;Password=SwN12345678;TrustServerCertificate=True
    depends_on:
      - inventorydb
    ports:
      - "6001:8080"
      - "6061:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
  salesservice:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - ConnectionStrings__Database=Server=orderdb;Database=OrderDb;User Id=sa;Password=SwN12345678;TrustServerCertificate=True
      - GrpcSettings__InventoryUrl=https://inventoryservice:8081
      - MessageBroker__Host=amqp://ecommerce-mq:5672
      - MessageBroker__UserName=guest
      - MessageBroker__Password=guest
    depends_on:
      - orderdb
      - inventoryservice
      - messagebroker
      # orderdb :
      #   condition: service_healthy
      # inventoryservice:
      #  condition: service_started
      # messagebroker:
      #   condition: service_started
    ports:
      - "6000:8080"
      - "6060:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
     
volumes:
  orderdbdata:
  inventorydbdata: